<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      overflow-y: auto;
      padding: 100px 60px 60px 120px;
      background: linear-gradient(135deg, #fcebbf 0%, #8fbc93 100%);
    }

    h1 {
      font-weight: 400;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 5;
    }

    .collage {
      position: relative;
      z-index: 5;
      max-width: 1000px;
      margin: 0 auto;
      column-count: 3;
      column-gap: 16px;
    }

    .collage img {
      width: 100%;
      display: block;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      break-inside: avoid;
      transition: transform 0.4s ease;
    }

    .collage img:hover {
      transform: scale(1.03) rotate(-1deg);
    }

    .floating-card {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 25;
      animation: floatSoft 4.8s ease-in-out infinite;
    }

    .floating-card button {
      width: 112px;
      height: 112px;
      padding: 0;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .floating-card button:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 48px rgba(0,0,0,0.25);
    }

    .floating-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .frame-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(10, 10, 10, 0.38);
      backdrop-filter: blur(8px);
      z-index: 40;
    }

    .frame-modal.active {
      display: flex;
    }

    .frame-panel {
      position: relative;
      width: min(92vw, 720px);
      background: rgba(255, 248, 241, 0.95);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.28);
      padding: 18px;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .frame-modal.active .frame-panel {
      transform: scale(1);
      opacity: 1;
    }

    .frame-panel img {
      width: 100%;
      max-height: 78vh;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .frame-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #4b2b2b;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 720px) {
      body { padding: 90px 20px 40px; }
      .collage { column-count: 2; }
      .floating-card { right: 16px; bottom: 16px; }
      .floating-card button { width: 96px; height: 96px; }
    }
  </style>
</head>
<body>
  <div class="eyebrow" style="position:relative; z-index:5; text-align:center; display:block;">everything else</div>
  <h1>gallery</h1>

  <div class="collage" id="collage"></div>

  <script>
    const photoCount = 15;
    const emojis = ["🤍","✨","🎀","🎂","🫦","🌷","🫶","🕊️"];
    const preferredImages = ['15.jpg', 'gallery15.jpg', '15903404930638232.jpg'];

    const collage = document.getElementById('collage');
    for (let i = 1; i <= photoCount; i++) {
      const img = document.createElement('img');
      img.src = `../assets/images/gallery${i}.jpg`;
      img.alt = "";
      collage.appendChild(img);
    }

    const floatingCard = document.createElement('div');
    floatingCard.className = 'floating-card';

    const floatingButton = document.createElement('button');
    floatingButton.type = 'button';
    floatingButton.setAttribute('aria-label', 'Open the framed photo');

    const floatingImg = document.createElement('img');
    floatingImg.alt = 'A soft framed photo';
    floatingImg.src = `../assets/images/${preferredImages[0]}`;

    const assignImage = (idx) => {
      if (idx >= preferredImages.length) return;
      const candidate = preferredImages[idx];
      floatingImg.src = `../assets/images/${candidate}`;
      floatingImg.onerror = () => assignImage(idx + 1);
    };

    floatingImg.addEventListener('error', () => assignImage(1));
    assignImage(0);

    floatingButton.appendChild(floatingImg);
    floatingButton.addEventListener('click', () => {
      modal.classList.add('active');
    });
    floatingCard.appendChild(floatingButton);
    document.body.appendChild(floatingCard);

    const modal = document.createElement('div');
    modal.className = 'frame-modal';

    const framePanel = document.createElement('div');
    framePanel.className = 'frame-panel';

    const modalImage = document.createElement('img');
    modalImage.alt = 'Framed photo';
    modalImage.src = floatingImg.src;

    const closeButton = document.createElement('button');
    closeButton.className = 'frame-close';
    closeButton.type = 'button';
    closeButton.textContent = '✕';
    closeButton.addEventListener('click', () => modal.classList.remove('active'));

    framePanel.appendChild(modalImage);
    framePanel.appendChild(closeButton);
    modal.appendChild(framePanel);
    document.body.appendChild(modal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.classList.remove('active');
      }
    });

    for (let i = 0; i < 18; i++) {
      const span = document.createElement('span');
      span.className = 'floating-emoji';
      span.textContent = emojis[i % emojis.length];
      span.style.fontSize = `${16 + Math.random() * 20}px`;
      span.style.top = `${Math.random() * 100}%`;
      span.style.left = `${Math.random() * 100}%`;
      span.style.animationDelay = `${Math.random() * 8}s`;
      span.style.animationDuration = `${8 + Math.random() * 6}s`;
      span.style.opacity = 0.5 + Math.random() * 0.3;
      document.body.appendChild(span);
    }
  </script>
</body>
</html>
