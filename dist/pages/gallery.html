<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      overflow-y: auto;
      padding: 100px 60px 60px 120px;
      background: linear-gradient(135deg, #fcebbf 0%, #8fbc93 100%);
    }

    h1 {
      font-weight: 400;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 5;
      color: rgba(14, 2, 4, 0.72);
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
    }

    .eyebrow {
      color: rgba(14, 2, 4, 0.6);
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      letter-spacing: 0.2em;
      font-size: 0.68rem;
      opacity: 0.9;
    }

    .floating-photos {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
    }

    .floating-photo {
      position: absolute;
      width: 54px;
      height: 54px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 12px 22px rgba(88, 104, 75, 0.14);
      cursor: pointer;
      pointer-events: auto;
      animation: floatSoft 4.8s ease-in-out infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .floating-photo:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 16px 28px rgba(88, 104, 75, 0.2);
      filter: saturate(1.08);
    }

    .floating-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .frame-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(10, 10, 10, 0.38);
      backdrop-filter: blur(8px);
      z-index: 40;
    }

    .frame-modal.active {
      display: flex;
    }

    .frame-panel {
      position: relative;
      width: min(92vw, 720px);
      background: rgba(255, 248, 241, 0.95);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.28);
      padding: 18px;
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .frame-modal.active .frame-panel {
      transform: scale(1);
      opacity: 1;
    }

    .frame-panel img {
      width: 100%;
      max-height: 78vh;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .frame-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #4b2b2b;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 720px) {
      body { padding: 90px 20px 40px; }
      .floating-photo { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="eyebrow" style="position:relative; z-index:5; text-align:center; display:block;">everything else</div>
  <h1>gallery</h1>

  <script>
    const photoCount = 15;
    const emojis = ["🤍","✨","🎀","🎂","🫦","🌷","🫶","🕊️"];

    const floatingPhotos = document.createElement('div');
    floatingPhotos.className = 'floating-photos';
    document.body.appendChild(floatingPhotos);

    const modal = document.createElement('div');
    modal.className = 'frame-modal';
    const framePanel = document.createElement('div');
    framePanel.className = 'frame-panel';
    const modalImage = document.createElement('img');
    modalImage.alt = 'Framed photo';
    const closeButton = document.createElement('button');
    closeButton.className = 'frame-close';
    closeButton.type = 'button';
    closeButton.textContent = '✕';
    closeButton.addEventListener('click', () => modal.classList.remove('active'));

    framePanel.appendChild(modalImage);
    framePanel.appendChild(closeButton);
    modal.appendChild(framePanel);
    document.body.appendChild(modal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.classList.remove('active');
      }
    });

    const showImage = (src) => {
      modalImage.src = src;
      modal.classList.add('active');
    };

    const photoSize = window.innerWidth <= 720 ? 40 : 54;
    const occupiedPositions = [];

    for (let i = 1; i <= photoCount; i++) {
      let left = 0;
      let top = 0;
      let placed = false;

      for (let attempt = 0; attempt < 300; attempt++) {
        const maxLeft = Math.max(24, window.innerWidth - photoSize - 24);
        const maxTop = Math.max(24, window.innerHeight - photoSize - 24);
        left = 18 + Math.random() * (maxLeft - 18);
        top = 18 + Math.random() * (maxTop - 18);

        const overlaps = occupiedPositions.some((position) => {
          const horizontalGap = Math.abs(position.left - left);
          const verticalGap = Math.abs(position.top - top);
          return horizontalGap < (position.size + photoSize) * 0.7 && verticalGap < (position.size + photoSize) * 0.7;
        });

        if (!overlaps) {
          placed = true;
          break;
        }
      }

      if (!placed) {
        left = 18 + ((i * 97) % 70);
        top = 18 + ((i * 53) % 70);
      }

      occupiedPositions.push({ left, top, size: photoSize });

      const floatingButton = document.createElement('button');
      floatingButton.type = 'button';
      floatingButton.className = 'floating-photo';
      floatingButton.setAttribute('aria-label', `Open photo ${i}`);
      floatingButton.style.animationDelay = `${i * 0.14}s`;
      floatingButton.style.left = `${left}px`;
      floatingButton.style.top = `${top}px`;
      floatingButton.style.width = `${photoSize}px`;
      floatingButton.style.height = `${photoSize}px`;
      floatingButton.style.transform = `rotate(${Math.random() * 16 - 8}deg)`;

      const floatingImg = document.createElement('img');
      floatingImg.src = `../assets/images/${i}.jpeg`;
      floatingImg.alt = `photo ${i}`;
      floatingButton.appendChild(floatingImg);
      floatingButton.addEventListener('click', () => showImage(floatingImg.src));
      floatingPhotos.appendChild(floatingButton);
    }

    for (let i = 0; i < 18; i++) {
      const span = document.createElement('span');
      span.className = 'floating-emoji';
      span.textContent = emojis[i % emojis.length];
      span.style.fontSize = `${16 + Math.random() * 20}px`;
      span.style.top = `${Math.random() * 100}%`;
      span.style.left = `${Math.random() * 100}%`;
      span.style.animationDelay = `${Math.random() * 8}s`;
      span.style.animationDuration = `${8 + Math.random() * 6}s`;
      span.style.opacity = 0.5 + Math.random() * 0.3;
      document.body.appendChild(span);
    }
  </script>
  <script src="shared-audio.js"></script>
</body>
</html>
