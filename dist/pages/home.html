<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>home</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 90px 40px 110px;
      background: linear-gradient(135deg, #eefee8 0%, #fcebbf 100%);
    }

    .grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 40px;
      align-items: start;
      position: relative;
      z-index: 5;
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .box {
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .box:hover {
      transform: translateY(-4px);
    }

    .photo-box {
      height: 340px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-box .fallback {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      padding: 20px;
    }

    .caption-line {
      font-size: 1.1rem;
      color: var(--cream);
      opacity: 0.9;
      padding-left: 4px;
    }

    .playing-box {
      background: var(--gold);
      color: var(--wine);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
    }

    .playing-box .bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
    }

    .playing-box .bars span {
      width: 3px;
      background: var(--wine);
      animation: eq 0.9s ease-in-out infinite;
    }
    .playing-box .bars span:nth-child(1) { height: 60%; animation-delay: 0s; }
    .playing-box .bars span:nth-child(2) { height: 100%; animation-delay: 0.2s; }
    .playing-box .bars span:nth-child(3) { height: 40%; animation-delay: 0.4s; }

    @keyframes eq {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .joke-box {
      background: var(--gold);
      color: var(--wine);
      flex: 1;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.6rem;
      padding: 30px;
      position: relative;
      cursor: default;
    }

    .joke-box .small-note {
      position: absolute;
      bottom: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      opacity: 0.55;
      letter-spacing: 0.05em;
    }

    .heading {
      position: absolute;
      top: 40px;
      left: 110px;
      z-index: 5;
    }

    .heading h1 {
      font-size: 1.4rem;
      font-weight: 400;
      opacity: 0.9;
    }

    @media (max-width: 820px) {
      body { padding: 100px 24px 40px; }
      .grid { grid-template-columns: 1fr; }
      .heading { left: 24px; }
    }
  </style>
</head>
<body>
  <img src="../assets/images/vflt1.jpg" class="floating" style="width:80px;height:80px;top:8%; left:6%; animation-delay:0s">
  <img src="../assets/images/vflt2.jpg" class="floating" style="width:70px;height:70px;top:15%; right:8%; animation-delay:2s">
  <img src="../assets/images/vflt3.jpg" class="floating" style="width:85px;height:85px;bottom:10%; left:10%; animation-delay:4s">

  <div class="heading">
    <span class="eyebrow">happy birthday</span>
    <h1 id="typed-title"></h1>
  </div>

  <div class="grid">
    <div class="col-left">
      <div class="box photo-box">
        <img src="../assets/images/home-photo.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <div class="fallback" style="display:none;">drop home-photo.jpg into<br>assets/images/</div>
      </div>
      <div class="caption-line" id="caption-line"></div>
    </div>

    <div class="col-right">
      <div class="box playing-box">
        <div class="bars"><span></span><span></span><span></span></div>
        <span id="now-playing">currently playing: xyz</span>
      </div>
      <div class="box joke-box">
        <span id="joke-text">lets breakup &lt;/3</span>
        <span class="small-note">jk jk (unless...)</span>
      </div>
    </div>
  </div>

  <script>
    const title = "for my favorite person";
    const caption = "boday gourlllllllll yayyyyyyyyyyyy";

    document.getElementById('typed-title').textContent = title;
    document.getElementById('caption-line').textContent = caption;
  </script>
</body>
</html>
