<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>you</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 20px 40px;
      overflow-y: auto;
      background: linear-gradient(135deg, #c9b297 0%, #eefee8 100%);
    }

    .wrap {
      position: relative;
      z-index: 5;
      width: min(100%, 1200px);
      text-align: center;
      margin: 0 auto;
    }

    .wrap .eyebrow {
      display: block;
      margin-bottom: 6px;
    }

    h1 {
      font-weight: 400;
      font-size: 1.6rem;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .butta {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.08);
      min-height: 0;
      min-width: 0;
    }

    .butta.placeholder {
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.82);
      font-size: 0.95rem;
      padding: 1rem;
      text-align: center;
    }

    .butta img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .butta:hover img {
      transform: scale(1.06);
    }

    .butta .caption {
      position: absolute;
      inset: auto 0 0 0;
      background: linear-gradient(0deg, rgba(14,2,4,0.92), transparent);
      color: var(--cream);
      font-size: 0.95rem;
      padding: 26px 14px 12px;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }

    .butta:hover .caption {
      transform: translateY(0);
    }

    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(4, minmax(140px, 1fr)); }
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 600px) {
      body { padding: 30px 18px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <span class="eyebrow">just her</span>
    <h1>you, mostly</h1>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const photos = [
      { name: 'you1', ext: 'jpeg' },
      { name: 'you2', ext: 'jpeg' },
      { name: 'you3', ext: 'jpeg' },
      { name: 'you4', ext: 'jpeg' },
      { name: 'you5', ext: 'jpeg' },
      { name: 'you6', ext: 'jpg' },
      { name: 'you7', ext: 'jpg' },
      { name: 'you8', ext: 'jpg' },
      { name: 'you9', ext: 'jpg' },
      { name: 'you10', ext: 'jpg' },
    ];

    const captions = [
      "this one's unfair honestly",
      "certified cutie behavior",
      "iconic era",
      "no thoughts just this photo",
      "okay this is the best one",
      "this one's still a favorite",
      "low-key perfect",
      "best photo energy",
      "wow, love this",
      "this one is the mood",
    ];

    const grid = document.getElementById('grid');

    photos.forEach((photo, index) => {
      const butta = document.createElement('div');
      butta.className = 'butta';

      const img = document.createElement('img');
      img.src = `../assets/images/${photo.name}.${photo.ext}`;
      img.alt = photo.name;
      img.dataset.photoName = photo.name;
      img.dataset.fallback = photo.ext;

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.textContent = captions[index] || photo.name;

      img.onerror = () => {
        if (img.dataset.fallback === 'jpeg') {
          img.dataset.fallback = 'jpg';
          img.src = `../assets/images/${photo.name}.jpg`;
          return;
        }

        if (img.dataset.fallback === 'jpg') {
          img.dataset.fallback = 'jpeg';
          img.src = `../assets/images/${photo.name}.jpeg`;
          return;
        }

        butta.className = 'butta placeholder';
        butta.textContent = photo.name;
      };

      butta.appendChild(img);
      butta.appendChild(caption);
      grid.appendChild(butta);
    });
  </script>
  <script>
    const emojis = ["🤍","✨","🎀","🎂","🫦","🌷","🫶","🕊️"];
    for (let i = 0; i < 18; i++) {
      const span = document.createElement('span');
      span.className = 'floating-emoji';
      span.textContent = emojis[i % emojis.length];
      span.style.fontSize = `${16 + Math.random() * 20}px`;
      span.style.top = `${Math.random() * 100}%`;
      span.style.left = `${Math.random() * 100}%`;
      span.style.animationDelay = `${Math.random() * 8}s`;
      span.style.animationDuration = `${8 + Math.random() * 6}s`;
      span.style.opacity = 0.5 + Math.random() * 0.3;
      document.body.appendChild(span);
    }
  </script>
  <script src="shared-audio.js"></script>
</body>
</html>
